<!DOCTYPE html>
<html lang="fr-CA">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <title>Wasabi — essai du clavier</title>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#F6F4EC">
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0E0F0C">
  <link rel="stylesheet" href="tokens.css">
  <link rel="stylesheet" href="app.css">
  <!-- MAQUETTE JETABLE (feuille de route § 8) : vérifier sur un VRAI iPhone que
       la boîte d'ajout et ses suggestions restent collées au-dessus du clavier,
       avant de bâtir la phase 1 dessus. Aucune donnée, aucun compte.
       À ouvrir dans Safari ET depuis l'app installée (comportements différents). -->
  <style>
    .liste { display: flex; flex-direction: column; gap: 6px; padding-bottom: 150px; }
    .article {
      min-height: 52px; display: flex; align-items: center; gap: 12px; padding: 0 14px;
      background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-sm);
    }
    .article .qte { margin-left: auto; color: var(--text-muted); }
    .case { width: 24px; height: 24px; border-radius: 7px; border: 1.5px solid var(--text-disabled); flex: none; }

    .ajout {
      position: fixed; left: 0; right: 0; z-index: 9;
      bottom: calc(var(--tabbar-h) + env(safe-area-inset-bottom));
      background: var(--bg); border-top: 1px solid var(--border);
      padding: 8px max(12px, env(safe-area-inset-right)) 8px max(12px, env(safe-area-inset-left));
      will-change: transform;
    }
    .ajout-in { max-width: var(--col); margin: 0 auto; display: flex; flex-direction: column; gap: 8px; }
    .puces { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; }
    .puces::-webkit-scrollbar { display: none; }
    .puce {
      flex: none; min-height: 36px; padding: 0 14px; border: 0; border-radius: 18px;
      background: var(--surface-2); color: var(--text); font: inherit; font-size: 15px;
    }
    .puce:active { background: var(--tag-bg); color: var(--tag-text); }
    .ligne { display: flex; gap: 8px; align-items: center; }
    .ligne input { flex: 1; }
    .pas {
      display: flex; align-items: center; flex: none;
      border: 1px solid var(--border); border-radius: var(--radius-sm); background: var(--surface);
    }
    .pas button { width: 44px; height: 46px; border: 0; background: none; font-size: 22px; color: var(--text); }
    .pas button:disabled { color: var(--text-disabled); }
    .pas output { min-width: 20px; text-align: center; font-weight: 600; }

    /* Clavier ouvert : la boîte se pose sur le clavier, la barre d'onglets disparaît. */
    body.clavier .tabbar { display: none; }
    body.clavier .ajout { bottom: 0; }

    .mesures { font: 12px/1.5 ui-monospace, Menlo, monospace; color: var(--text-muted); white-space: pre; }
  </style>
</head>
<body>
  <div id="app">
    <main class="screen">
      <header class="screen-head"><h1>Essai du clavier</h1></header>
      <section class="card">
        <p class="help">Touche le champ du bas. La boîte et les pastilles doivent se coller au clavier, sans saut ni espace. Ajoute plusieurs articles de suite : le clavier doit rester ouvert.</p>
        <div class="mesures" id="mesures"></div>
      </section>
      <div class="liste" id="liste"></div>
    </main>

    <div class="ajout" id="ajout">
      <div class="ajout-in">
        <div class="puces" id="puces"></div>
        <div class="ligne">
          <input type="text" id="champ" placeholder="Ajouter un article" autocomplete="off" autocorrect="off" enterkeyhint="done">
          <div class="pas">
            <button type="button" id="moins" aria-label="Moins" disabled>−</button>
            <output id="qte">1</output>
            <button type="button" id="plus" aria-label="Plus">+</button>
          </div>
          <button type="button" class="btn btn-primary" id="ajouter">Ajouter</button>
        </div>
      </div>
    </div>

    <nav class="tabbar">
      <button class="tab" aria-current="page"><span>Épicerie</span></button>
      <button class="tab"><span>Recettes</span></button>
      <button class="tab"><span>Réglages</span></button>
    </nav>
  </div>

  <script>
    const $ = (id) => document.getElementById(id);
    const ajout = $("ajout"), champ = $("champ"), liste = $("liste"), puces = $("puces");
    let qte = 1;
    const frequents = ["Lait", "Pain", "Œufs", "Bananes", "Beurre", "Café", "Yogourt", "Tomates", "Fromage", "Oignons", "Pommes", "Riz"];

    // --- Le point à valider : suivre le clavier avec visualViewport ----------
    // Sur iOS, un élément « fixed » en bas reste sous le clavier : la fenêtre de
    // mise en page ne rétrécit pas, seule la fenêtre visuelle le fait.
    const vv = window.visualViewport;
    function placer() {
      const clavier = vv ? Math.max(0, window.innerHeight - vv.height - vv.offsetTop) : 0;
      ajout.style.transform = clavier ? `translateY(${-clavier}px)` : "";
      document.body.classList.toggle("clavier", clavier > 80 || (document.activeElement === champ && clavier > 0));
      $("mesures").textContent =
        `innerHeight   ${window.innerHeight}\n` +
        `vv.height     ${vv ? Math.round(vv.height) : "—"}\n` +
        `vv.offsetTop  ${vv ? Math.round(vv.offsetTop) : "—"}\n` +
        `clavier       ${Math.round(clavier)} px\n` +
        `installée     ${matchMedia("(display-mode: standalone)").matches || navigator.standalone === true}`;
    }
    if (vv) { vv.addEventListener("resize", placer); vv.addEventListener("scroll", placer); }
    window.addEventListener("resize", placer);
    champ.addEventListener("focus", () => setTimeout(placer, 50));
    champ.addEventListener("blur", () => setTimeout(placer, 50));
    placer();

    // --- Comportement de la boîte (feuille de route § 6.1) --------------------
    function majQte(n) { qte = Math.max(1, n); $("qte").textContent = qte; $("moins").disabled = qte === 1; }
    function majPuces() {
      const presents = new Set([...liste.querySelectorAll(".nom")].map((n) => n.textContent));
      puces.innerHTML = "";
      frequents.filter((f) => !presents.has(f)).slice(0, 8).forEach((f) => {
        const b = document.createElement("button");
        b.type = "button"; b.className = "puce"; b.textContent = f;
        puces.appendChild(b);
      });
    }
    function ajouter(nom) {
      nom = nom.trim();
      if (!nom) return;
      const el = document.createElement("div");
      el.className = "article";
      el.innerHTML = `<span class="case"></span><span class="nom"></span><span class="qte"></span>`;
      el.querySelector(".nom").textContent = nom;
      el.querySelector(".qte").textContent = qte > 1 ? `×${qte}` : "";
      liste.prepend(el);
      champ.value = "";
      majQte(1);
      majPuces();
    }

    // Toucher un bouton ne doit pas enlever le focus du champ, sinon le clavier
    // se referme entre deux ajouts.
    ajout.addEventListener("pointerdown", (e) => { if (e.target.closest("button")) e.preventDefault(); });
    ajout.addEventListener("click", (e) => {
      const b = e.target.closest("button");
      if (!b) return;
      if (b.id === "plus") majQte(qte + 1);
      else if (b.id === "moins") majQte(qte - 1);
      else if (b.id === "ajouter") ajouter(champ.value);
      else if (b.classList.contains("puce")) ajouter(b.textContent);
    });
    champ.addEventListener("keydown", (e) => { if (e.key === "Enter") { e.preventDefault(); ajouter(champ.value); } });

    for (const nom of ["Farine", "Sel", "Poivre", "Huile d'olive", "Pâtes", "Carottes", "Céleri", "Ail", "Citrons", "Poulet", "Saumon", "Épinards", "Crème", "Sucre"]) ajouter(nom);
    majPuces();
  </script>
</body>
</html>
